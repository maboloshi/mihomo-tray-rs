# mihomo-tray language file: English (United States).
#
# Copy this file, rename it to your system's tag and translate the values on the
# right; that copy is the one the program reads, this file is only a template and
# is regenerated on every build. The interface follows the Windows UI language,
# and that language's tag is the file name: `lang/ja-JP.yml` is used when
# Windows runs in Japanese. To see the tag, run in PowerShell:
#
#     (Get-UICulture).Name
#
# Keys you leave out fall back to the built-in English strings, and a key with an
# empty value counts as left out. A value is everything after the first `:`, so
# it may contain '#', ':' and apostrophes as they are; only a whole line that
# starts with '#' is a comment.
#
# {name}, {kind}, {mode}, {port}, {pid}, {path}, {address}, {error}, {version},
# {proxy} and {tun} are filled in at run time: keep them spelled exactly as they
# are here.
#
# Everything below this line is written by build.rs from the built-in English table in src/i18n.rs: change a string there, not here.

