[package]
name = "mihomo-tray"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Minimal Windows tray app for the mihomo core"
license = "MIT"

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinInet",
] }
serde_json = "1"
winreg = "0.56"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
